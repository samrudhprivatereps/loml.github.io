<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smile · Letters For My Love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="letter-page">
    <main class="paper float-soft" data-letter-root>
      <h1 class="script">Just to make you smile</h1>
      <p class="meta">A pocket-sized sun, delivered to your heart.</p>
      <section class="message" data-message="(A random note for no reason)

      Just wanted to interrupt your day to remind you that you're awesome. And cute. And you're mine.
      
      Okay, that's all. Go back to what you were doing.  I love youuuuuuuuuuuuuuuu."></section>
      <div class="controls">
        <button class="toggle" data-audio-toggle aria-pressed="false">incase u wanna hear me say it click on this</button>
        <audio preload="none">
          <source src="../assets/audio/smile.m4a" type="audio/mp4" />
        </audio>
      </div>
    </main>
    <footer class="site-footer"><p class="quote">Wherever you are, my love reaches you.</p></footer>
    <script src="../script.js"></script>
  </body>
  </html>
