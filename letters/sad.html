      <section class="message" data-message="My love,

If my words ever hurt you, I'm sorry. I didn't mean to. I'm just too scared to lose you. I'm too scared that you'll end up hating me. I'm too scared I’ll get annoying and too clingy. I'm scared I'll ruin your life. I'm scared I'll ruin our life. I'm scared I'll ruin our future. I'm scared I'll ruin our happiness. I'm scared I'll ruin our life. I'm scared I'll ruin our future. I'm scared I'll ruin our happiness.  

We’ll move slowly. We’ll understand. I choose you, and I’ll keep choosing you. I love you."></section
