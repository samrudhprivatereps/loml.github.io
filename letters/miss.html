<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miss You · Letters For My Love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body class="letter-page">
    <main class="paper float-soft" data-letter-root>
      <h1 class="script">When you miss me</h1>
      <p class="meta">Meet me in the space between seconds.</p>
      <section class="message" data-message="Good, because I'm missing you like crazy.

      It just feels weird when you're not around. It’s like a part of me is missing. Just close your eyes for a second and picture me giving you a huge hug. I'll see you so soon."></section>
      <div class="controls">
        <button class="toggle" data-audio-toggle aria-pressed="false">incase u wanna hear me say it click on this</button>
        <audio preload="none">
          <source src="../assets/audio/miss.m4a" type="audio/mp4" />
        </audio>
      </div>
    </main>
    <footer class="site-footer"><p class="quote">Wherever you are, my love reaches you.</p></footer>
    <script src="../script.js"></script>
  </body>
  </html>
