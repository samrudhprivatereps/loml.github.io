    <main class="paper float-soft" data-letter-root>
      <h1 class="script">When you feel unloved</h1>
      <p class="meta">You are cherished — endlessly and without condition.</p>
      <section class="message" data-message="Read this very carefully:

      <div class="controls">
        <button class="toggle" data-audio-toggle aria-pressed="false">incase u wanna hear me say it click on this</button>
