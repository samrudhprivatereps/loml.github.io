  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

  <body class="letter-page">
    <main class="paper float-soft" data-letter-root>
      <h1 class="script">When you're tired</h1>
      <p class="meta">Lay your head here — I’ll keep watch.</p>
      <section class="message" data-message="Hey, you need to chill.

      Seriously, put your phone down (after this, obviously). Close your laptop. Just stop for a bit. You've earned a break. Everything else can wait. Let your brain and body just... exist. Sending you all the cozy, lazy vibes. Go get some rest.mwahhhhhhhhhhhh"></section>
      <div class="controls">
        <button class="toggle" data-audio-toggle aria-pressed="false">incase u wanna hear me say it click on this</button>
        <audio preload="none">
          <source src="../assets/audio/tired.m4a" type="audio/mp4" />
        </audio>
      </div>
    </main>
    <footer class="site-footer"><p class="quote">Wherever you are, my love reaches you.</p></footer>
    <script src="../script.js"></script>
  </body>
