<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Developer · Letters For My Love</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .admin{max-width:840px;margin:24px auto;padding:20px;border-radius:14px;background:#fff7fb;box-shadow:0 18px 40px rgba(210,154,154,.25), inset 0 0 0 1px #f0e2df}
      .admin h1{font-family:"Great Vibes", cursive; margin:0 0 10px}
      .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
      .card{padding:12px;border-radius:12px;background:#fff;box-shadow:0 10px 22px rgba(210,154,154,.18), inset 0 0 0 1px #f1e2dc}
      .row{display:flex;gap:8px;align-items:center;margin:6px 0}
      .row input[type="text"]{flex:1;padding:8px;border-radius:8px;border:1px solid #efdcd4}
      .actions{display:flex;gap:10px; margin-top:14px}
      .btn{appearance:none;border:none;border-radius:999px;padding:10px 14px;background:#ffe9f1;color:#6b5242;box-shadow:0 8px 18px rgba(210,154,154,.25), inset 0 0 0 1px #edd8d1;cursor:pointer}
      .preview{height:160px;border-radius:10px;overflow:hidden;background:#fff6f8;display:grid;place-items:center;margin-top:8px}
      .preview img,.preview video{width:100%;height:100%;object-fit:cover}
      .hint{font-size:13px;color:#7a5a4a;opacity:.9}
    </style>
  </head>
  <body>
    <main class="admin" data-admin>
      <h1 class="script">Developer Vault Uploader</h1>
      <p class="hint">Add up to 6 items (exactly 4 images and 2 videos recommended). Use a file OR a path. Paths persist (e.g. assets/images/photo1.jpg). Files create temporary preview links for this browser only.</p>
      <div class="grid" id="items"></div>
      <div class="actions">
        <button class="btn" id="saveAdmin">Save to Vault</button>
        <button class="btn" id="clearAdmin">Clear config</button>
        <a class="btn" href="./vault.html">Open Vault</a>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
